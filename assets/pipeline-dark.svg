<svg xmlns="http://www.w3.org/2000/svg" width="480" height="636" viewBox="0 0 480 636" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Each file advances independently through the pipeline</title>
  <desc id="description">Three stacked file cards show review and verification states. File A has finished both stages. File B is still being reviewed. File C is being verified without waiting for file B. This is an illustrated execution snapshot, not a product screenshot.</desc>
  <rect x="1" y="1" width="478" height="634" rx="20" fill="#11161D" stroke="#485869" stroke-width="2"/>
  <g font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
    <text x="24" y="49" fill="#F1F5F9" font-size="30" font-weight="700">Independent by design.</text>
    <text x="24" y="84" fill="#B8C7D4" font-size="24">Each file moves at its own pace.</text>
    <g>
      <rect x="24" y="112" width="432" height="156" rx="14" stroke="#485869" stroke-width="1.5"/>
      <text x="44" y="149" fill="#F1F5F9" font-size="26" font-weight="700">file A</text>
      <text x="436" y="149" text-anchor="end" fill="#D9EDFB" font-size="24">Result ready</text>
      <rect x="44" y="166" width="168" height="78" rx="10" fill="#1B2935" stroke="#7799AF" stroke-width="2"/>
      <text x="60" y="197" fill="#D9EDFB" font-size="26" font-weight="700">Review</text>
      <text x="60" y="227" fill="#D9EDFB" font-size="24">Done</text>
      <path d="M176 220l6 6 11-12" stroke="#D9EDFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="268" y="166" width="168" height="78" rx="10" fill="#1B2935" stroke="#7799AF" stroke-width="2"/>
      <text x="284" y="197" fill="#D9EDFB" font-size="26" font-weight="700">Verify</text>
      <text x="284" y="227" fill="#D9EDFB" font-size="24">Done</text>
      <path d="M400 220l6 6 11-12" stroke="#D9EDFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M226 205h28m-7-6 7 6-7 6" stroke="#91AEC2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <rect x="24" y="284" width="432" height="156" rx="14" stroke="#485869" stroke-width="1.5"/>
      <text x="44" y="321" fill="#F1F5F9" font-size="26" font-weight="700">file B</text>
      <text x="436" y="321" text-anchor="end" fill="#B8C7D4" font-size="24">Result pending</text>
      <rect x="44" y="338" width="168" height="78" rx="10" fill="#30251E" stroke="#F2BC84" stroke-width="2"/>
      <text x="60" y="369" fill="#F2BC84" font-size="26" font-weight="700">Review</text>
      <text x="60" y="399" fill="#F2BC84" font-size="24">Running</text>
      <circle cx="185" cy="392" r="5" fill="#F2BC84" stroke="#F2BC84" stroke-width="2"/>
      <rect x="268" y="338" width="168" height="78" rx="10" fill="#151C24" stroke="#7B8A99" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="284" y="369" fill="#B8C7D4" font-size="26" font-weight="700">Verify</text>
      <text x="284" y="399" fill="#B8C7D4" font-size="24">Waiting</text>
      <circle cx="409" cy="392" r="6" fill="none" stroke="#B8C7D4" stroke-width="2"/>
      <path d="M226 377h28" stroke="#7B8A99" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 6"/>
    </g>
    <g>
      <rect x="24" y="456" width="432" height="156" rx="14" stroke="#485869" stroke-width="1.5"/>
      <text x="44" y="493" fill="#F1F5F9" font-size="26" font-weight="700">file C</text>
      <text x="436" y="493" text-anchor="end" fill="#B8C7D4" font-size="24">Result pending</text>
      <rect x="44" y="510" width="168" height="78" rx="10" fill="#1B2935" stroke="#7799AF" stroke-width="2"/>
      <text x="60" y="541" fill="#D9EDFB" font-size="26" font-weight="700">Review</text>
      <text x="60" y="571" fill="#D9EDFB" font-size="24">Done</text>
      <path d="M176 564l6 6 11-12" stroke="#D9EDFB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="268" y="510" width="168" height="78" rx="10" fill="#30251E" stroke="#F2BC84" stroke-width="2"/>
      <text x="284" y="541" fill="#F2BC84" font-size="26" font-weight="700">Verify</text>
      <text x="284" y="571" fill="#F2BC84" font-size="24">Running</text>
      <circle cx="409" cy="564" r="5" fill="#F2BC84" stroke="#F2BC84" stroke-width="2"/>
      <path d="M226 549h28m-7-6 7 6-7 6" stroke="#91AEC2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
