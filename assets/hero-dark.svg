<svg xmlns="http://www.w3.org/2000/svg" width="720" height="264" viewBox="0 0 720 264" fill="none" role="img" aria-labelledby="title description">
  <title id="title">OpenCode Workflow Engine</title>
  <desc id="description">OpenCode Workflow Engine, with a decorative branching mark representing coordinated agents.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="720" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2029"/>
      <stop offset="1" stop-color="#10151D"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="154" x2="654" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD39A"/>
      <stop offset="1" stop-color="#FFAC89"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="718" height="262" rx="24" fill="url(#surface)" stroke="#465361" stroke-width="2"/>
  <g font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-weight="700">
    <text x="40" y="76" fill="#F4F2EC" font-size="38" letter-spacing="-1">OpenCode</text>
    <text x="37" y="162" fill="url(#accent)" font-size="68" letter-spacing="-2.5">Workflow Engine</text>
  </g>
  <!-- Decorative only: no information depends on these unlabeled branches. -->
  <g stroke="#AED8EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M562 57H588C607 57 600 35 620 35H658"/>
    <path d="M588 57H658"/>
    <path d="M588 57C607 57 600 79 620 79H658"/>
    <circle cx="561" cy="57" r="6" fill="#FFD39A" stroke="none"/>
    <circle cx="664" cy="35" r="5" fill="#AED8EF" stroke="none"/>
    <circle cx="664" cy="57" r="5" fill="#AED8EF" stroke="none"/>
    <circle cx="664" cy="79" r="5" fill="#AED8EF" stroke="none"/>
  </g>
  <path d="M40 216H680" stroke="#465361" stroke-width="2"/>
  <path d="M40 216H160" stroke="#FFD39A" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 216H228" stroke="#AED8EF" stroke-width="4" stroke-linecap="round"/>
