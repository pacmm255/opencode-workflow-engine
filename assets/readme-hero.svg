<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">OpenCode Workflow Engine — One script. Many minds.</title>
  <desc id="description">A dark editorial banner with mint and lavender typography. Three independent agents flow from a script into a durable journal and a verified result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111724"/><stop offset=".55" stop-color="#0d111b"/><stop offset="1" stop-color="#131527"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8f5dc"/><stop offset="1" stop-color="#70dace"/></linearGradient>
    <linearGradient id="connector" gradientUnits="userSpaceOnUse" x1="120" y1="150" x2="460" y2="280"><stop stop-color="#86dfcd"/><stop offset=".5" stop-color="#aa9fe3"/><stop offset="1" stop-color="#86dfcd"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8771b5" stop-opacity=".15"/><stop offset="1" stop-color="#8771b5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c3d1e3" opacity=".12"/></pattern>
  </defs>
  <rect x="1" y="1" width="1438" height="558" rx="24" fill="url(#background)" stroke="#303547" stroke-width="2"/>
  <rect x="680" y="33" width="700" height="490" rx="24" fill="url(#grid)"/>
  <ellipse cx="1060" cy="280" rx="370" ry="270" fill="url(#glow)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(68 62)">
      <path d="M0 0h20v20H0z" fill="none" stroke="#9ee7ce" stroke-width="2"/>
      <path d="M7 7h20v20H7z" fill="#111724" stroke="#b8a6ef" stroke-width="2"/>
      <text x="47" y="20" font-size="15" font-weight="700" fill="#d4dce9" letter-spacing="3">OPENCODE / WORKFLOW ENGINE</text>
    </g>
    <text x="65" y="205" font-size="79" font-weight="750" fill="#eef2f7" letter-spacing="-4">One script.</text>
    <text x="65" y="294" font-size="79" font-weight="750" fill="url(#mint)" letter-spacing="-4">Many minds.</text>
    <text x="69" y="354" font-size="22" fill="#9ca9be">Parallel agents. Durable results.</text>
    <text x="69" y="388" font-size="22" fill="#9ca9be">A clear way back.</text>
    <g transform="translate(69 458)">
      <rect width="92" height="33" rx="16.5" fill="#192c2c" stroke="#365a51"/>
      <text x="46" y="22" text-anchor="middle" font-size="12" font-weight="650" letter-spacing="2" fill="#adebd6">WRITE</text>
      <path d="M105 17h23m-5-5 5 5-5 5" fill="none" stroke="#546079" stroke-width="1.5"/>
      <rect x="141" width="76" height="33" rx="16.5" fill="#282337" stroke="#4e4267"/>
      <text x="179" y="22" text-anchor="middle" font-size="12" font-weight="650" letter-spacing="2" fill="#c6b7f2">RUN</text>
      <path d="M230 17h23m-5-5 5 5-5 5" fill="none" stroke="#546079" stroke-width="1.5"/>
      <rect x="266" width="107" height="33" rx="16.5" fill="#192c2c" stroke="#365a51"/>
      <text x="319.5" y="22" text-anchor="middle" font-size="12" font-weight="650" letter-spacing="2" fill="#adebd6">RESUME</text>
    </g>
    <g transform="translate(700 71)">
      <rect width="661" height="405" rx="18" fill="#141925" fill-opacity=".8" stroke="#323a4e"/>
      <path d="M0 54h661" stroke="#303749"/>
      <circle cx="25" cy="27" r="4" fill="#8f769e"/><circle cx="40" cy="27" r="4" fill="#aa9572"/><circle cx="55" cy="27" r="4" fill="#72a291"/>
      <text x="86" y="32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9faec4">review.js</text>
      <rect x="477" y="15" width="166" height="25" rx="12.5" fill="#1a2d2a"/>
      <circle cx="493" cy="27.5" r="3.5" fill="#a5e5c7"/>
      <text x="505" y="32" font-size="9.5" font-weight="650" letter-spacing="1.1" fill="#a5e5c7">REAL CHILD SESSIONS</text>
      <text x="25" y="87" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#b9a4e8">await</text>
      <text x="80" y="87" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#d8e0ed">pipeline(files, review, verify)</text>
      <g fill="none" stroke="url(#connector)" stroke-width="2" stroke-linecap="round">
        <path d="M127 213h24c27 0 12-63 38-63h15"/><path d="M127 213h77"/><path d="M127 213h24c27 0 12 63 38 63h15"/>
        <path d="M357 150h21c27 0 14 63 41 63h24"/><path d="M357 213h86"/><path d="M357 276h21c27 0 14-63 41-63h24"/>
      </g>
      <rect x="25" y="181" width="102" height="64" rx="12" fill="#1d2c30" stroke="#648d80"/>
      <text x="76" y="208" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="650" fill="#bae9d6">{ }</text>
      <text x="76" y="230" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#a7c8c1">SCRIPT</text>
      <g font-size="13" fill="#d8d2eb">
        <rect x="204" y="123" width="153" height="54" rx="11" fill="#28253b" stroke="#77648f"/>
        <rect x="204" y="186" width="153" height="54" rx="11" fill="#28253b" stroke="#77648f"/>
        <rect x="204" y="249" width="153" height="54" rx="11" fill="#28253b" stroke="#77648f"/>
        <circle cx="226" cy="150" r="5" fill="#c4b0ed"/><circle cx="226" cy="213" r="5" fill="#c4b0ed"/><circle cx="226" cy="276" r="5" fill="#c4b0ed"/>
        <text x="244" y="155">Correctness</text><text x="244" y="218">Coverage</text><text x="244" y="281">Maintainability</text>
      </g>
      <rect x="443" y="172" width="191" height="82" rx="13" fill="#1b2d2c" stroke="#638c7a"/>
      <circle cx="466" cy="197" r="9" fill="#315c4a"/>
      <path d="m462 197 3 3 5-6" fill="none" stroke="#b9f3d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="484" y="202" font-size="15" font-weight="650" fill="#d4edde">Verify &amp; collect</text>
      <text x="463" y="232" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a0c3b6">result → journal → cache</text>
      <path d="M25 333h609" stroke="#303749"/>
      <text x="25" y="367" font-size="12" letter-spacing=".8" fill="#9aabc0">INDEPENDENT WORK</text>
      <text x="320" y="367" font-size="12" letter-spacing=".8" fill="#c6b7ed">SHARED PROGRESS</text>
      <circle cx="627" cy="363" r="4" fill="#9ee7ce"/>
    </g>
    <text x="1360" y="513" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#788aa4">COMPOSE / OBSERVE / REPLAY</text>
  </g>
</svg>
