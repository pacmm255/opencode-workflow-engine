<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A pipeline keeps every item moving independently</title>
  <desc id="description">An illustrative execution snapshot. File A has completed review and verification, and its result is ready. File B is still in review. File C has already advanced to verification without waiting for file B.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1440" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFAF5"/>
      <stop offset="1" stop-color="#F1F0EB"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="438" rx="24" fill="url(#paper)" stroke="#D9D7D0" stroke-width="2"/>
  <g font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
    <text x="56" y="65" fill="#252B31" font-size="32" font-weight="700" letter-spacing="-.6">Independent by design.</text>
    <text x="56" y="102" fill="#5B6670" font-size="22">Every item advances when its own work is ready.</text>
    <circle cx="1108" cy="65" r="5" fill="#9E542C"/>
    <text x="1123" y="72" fill="#5B6670" font-size="18">Running</text>
    <path d="M1234 65L1239 70L1248 60" stroke="#35627B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1261" y="72" fill="#5B6670" font-size="18">Complete</text>

    <g fill="#677A88" font-family="'Courier New', 'Liberation Mono', monospace" font-size="17" letter-spacing="1.8">
      <text x="58" y="153">ITEM</text>
      <text x="312" y="153">01 / REVIEW</text>
      <text x="722" y="153">02 / VERIFY</text>
      <text x="1112" y="153">RESULT</text>
    </g>
    <g fill="#2F5267" font-family="'Courier New', 'Liberation Mono', monospace" font-size="25" font-weight="700">
      <text x="58" y="221">file A</text>
      <text x="58" y="307">file B</text>
      <text x="58" y="393">file C</text>
    </g>

    <!-- Each lane is independent: there is no barrier between stages. -->
    <g stroke="#7392A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M186 212H285M277 207L285 212L277 217"/>
      <path d="M186 298H285M277 293L285 298L277 303"/>
      <path d="M186 384H285M277 379L285 384L277 389"/>
      <path d="M596 212H699M691 207L699 212L691 217"/>
      <path d="M986 212H1090M1082 207L1090 212L1082 217"/>
      <path d="M596 384H699M691 379L699 384L691 389"/>
    </g>
    <g stroke="#C4CAD0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 7">
      <path d="M596 298H699"/>
      <path d="M986 298H1090"/>
      <path d="M986 384H1090"/>
    </g>

    <g fill="#EAF0F3" stroke="#B5C8D3" stroke-width="1.5">
      <rect x="310" y="182" width="266" height="60" rx="12"/>
      <rect x="720" y="182" width="266" height="60" rx="12"/>
      <rect x="1110" y="182" width="274" height="60" rx="12"/>
      <rect x="310" y="354" width="266" height="60" rx="12"/>
    </g>
    <g fill="#F8EDE0" stroke="#C59269" stroke-width="1.5">
      <rect x="310" y="268" width="266" height="60" rx="12"/>
      <rect x="720" y="354" width="266" height="60" rx="12"/>
    </g>
    <g stroke="#C4CAD0" stroke-width="1.5" stroke-dasharray="4 5">
      <rect x="720" y="268" width="266" height="60" rx="12"/>
      <rect x="1110" y="268" width="274" height="60" rx="12"/>
      <rect x="1110" y="354" width="274" height="60" rx="12"/>
    </g>

    <g stroke="#35627B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M334 212L341 219L353 205"/>
      <path d="M744 212L751 219L763 205"/>
      <path d="M1134 212L1141 219L1153 205"/>
      <path d="M334 384L341 391L353 377"/>
    </g>
    <g fill="#2F5267" font-size="23" font-weight="700">
      <text x="370" y="220">Complete</text>
      <text x="780" y="220">Complete</text>
      <text x="1170" y="220">Result ready</text>
      <text x="370" y="392">Complete</text>
    </g>
    <g fill="#9E542C">
      <circle cx="343" cy="298" r="5"/>
      <circle cx="753" cy="384" r="5"/>
    </g>
    <g fill="#9E542C" font-size="23" font-weight="700">
      <text x="370" y="306">Reviewing</text>
      <text x="780" y="392">Verifying</text>
    </g>
    <g stroke="#87939C" stroke-width="1.5">
      <circle cx="753" cy="298" r="6"/>
      <circle cx="1143" cy="298" r="6"/>
      <circle cx="1143" cy="384" r="6"/>
    </g>
    <g fill="#64727D" font-size="22">
      <text x="780" y="306">Awaiting review</text>
      <text x="1170" y="306">Pending</text>
      <text x="1170" y="392">Pending</text>
    </g>
  </g>
</svg>
